<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Empire - Core Fixes Build</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-dim: #aaaaaa;
            --accent: #4CAF50;
            --accent-dim: #2e6930;
            --danger: #f44336;
            --bottom-nav-height: 80px;
        }

        /* Group 1 Fix: 100dvh and dynamic padding for mobile scrolling */
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(var(--bottom-nav-height) + 60px); 
        }

        header {
            position: sticky;
            top: 0;
            background-color: #1a1a1a;
            padding: 15px;
            border-bottom: 2px solid #333;
            z-index: 10;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat-box {
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .container {
            padding: 15px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
        }

        .row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .col-left {
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-weight: bold;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background-color: var(--accent-dim);
        }

        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: var(--danger);
        }

        /* Bottom Nav Placeholder */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--bottom-nav-height);
            background: #1a1a1a;
            border-top: 2px solid #333;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size: 0.8rem; color: var(--text-dim);">Balance</div>
                $<span id="display-money">0.00</span>
            </div>
            <div class="stat-box">
                <div style="font-size: 0.8rem; color: var(--text-dim);">Income</div>
                $<span id="display-income">0.00</span>/s
            </div>
            <div class="stat-box">
                <div style="font-size: 0.8rem; color: var(--text-dim);">Pallets</div>
                <span id="display-pallets">0</span>
            </div>
            <div class="stat-box">
                <div style="font-size: 0.8rem; color: var(--text-dim);">Capacity</div>
                <span id="display-capacity">50</span>/min
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Logistics & Dispatch -->
        <div class="panel">
            <h2>Logistics Hub</h2>
            <div class="row">
                <div class="col-left">
                    <span class="item-name">Distribution Hub (Lvl <span id="hub-level">1</span>)</span>
                    <span class="item-desc">Cost: $<span id="hub-cost">500.00</span></span>
                </div>
                <button id="btn-upgrade-hub" onclick="game.upgradeHub()">Upgrade</button>
            </div>
            <div class="row" style="margin-top: 15px;">
                <div class="col-left">
                    <span class="item-name">Dispatch Pallets</span>
                    <span class="item-desc">Value: $<span id="pallet-value">5.00</span>/ea</span>
                </div>
                <button class="btn-danger" id="btn-dispatch" onclick="game.dispatchPallets()">Dispatch All</button>
            </div>
        </div>

        <!-- Contracts & Events -->
        <div class="panel">
            <h2>Contracts</h2>
            <div class="row">
                <div class="col-left">
                    <span class="item-name">Active Contract</span>
                    <span class="item-desc">Progress: <span id="contract-progress">0</span>/10</span>
                </div>
                <button onclick="game.completeContract()">Fulfill</button>
            </div>
            <div class="row">
                <div class="col-left">
                    <span class="item-name">Rush Job</span>
                    <span class="item-desc">Cost: 10 Pallets</span>
                </div>
                <!-- Group 1 Fix: Rush jobs purchased via pallets now hook into the main tracker -->
                <button id="btn-rush" onclick="game.triggerRushJob(true)">Trigger Rush</button>
            </div>
        </div>

        <!-- Workers -->
        <div class="panel" id="worker-list">
            <h2>Workforce</h2>
            <!-- Generated via JS -->
        </div>

    </div>

    <div id="bottom-nav">
        <div style="color: var(--text-dim); font-size: 0.9rem;">Nav Layout - Fixed Heights</div>
    </div>

    <script>
        const game = {
            state: {
                money: 0,
                pallets: 0,
                hubLevel: 1,
                contractsCompleted: 0,
                highestTierUnlocked: 1,
                lastTick: Date.now()
            },

            // Group 2 Fix: Equal Scaling Multipliers.
            // Cost multiplier (1.15) > Income multiplier (1.08) forces contract reliance.
            constants: {
                costMultiplier: 1.15,
                incomeMultiplier: 1.08,
                baseHubCapacity: 50,
                capacityPerHubLevel: 25,
                basePalletValue: 5 // Static baseline
            },

            workers: [
                { id: 1, name: "Forklift Operator", baseCost: 10, baseIncome: 1, owned: 0 },
                { id: 2, name: "Pick/Pack Team", baseCost: 150, baseIncome: 12, owned: 0 },
                { id: 3, name: "Dispatch Manager", baseCost: 1200, baseIncome: 85, owned: 0 }
            ],

            init() {
                this.renderWorkers();
                this.gameLoop = setInterval(() => this.tick(), 100); // 10 ticks a second
                this.updateUI();
            },

            tick() {
                const now = Date.now();
                const delta = (now - this.state.lastTick) / 1000;
                this.state.lastTick = now;

                const incomePerSec = this.calculateIncome();
                this.state.money += incomePerSec * delta;

                // Passive pallet generation based on throughput, not just cash
                this.state.pallets += (this.state.hubLevel * 0.5) * delta;

                this.updateUI();
            },

            calculateIncome() {
                let total = 0;
                this.workers.forEach(w => {
                    // Group 2 Fix: Apply the flattened income curve
                    total += w.owned * w.baseIncome * Math.pow(this.constants.incomeMultiplier, w.owned);
                });
                return total;
            },

            getWorkerCost(workerId) {
                const w = this.workers.find(x => x.id === workerId);
                // Group 2 Fix: Cost curve outpaces income curve
                return w.baseCost * Math.pow(this.constants.costMultiplier, w.owned);
            },

            buyWorker(workerId) {
                const cost = this.getWorkerCost(workerId);
                if (this.state.money >= cost) {
                    this.state.money -= cost;
                    const w = this.workers.find(x => x.id === workerId);
                    w.owned++;
                    
                    if (workerId > this.state.highestTierUnlocked) {
                        this.state.highestTierUnlocked = workerId;
                    }
                    
                    this.renderWorkers();
                    this.updateUI();
                }
            },

            getHubCost() {
                return 500 * Math.pow(1.2, this.state.hubLevel);
            },

            upgradeHub() {
                const cost = this.getHubCost();
                if (this.state.money >= cost) {
                    this.state.money -= cost;
                    this.state.hubLevel++;
                    this.updateUI();
                }
            },

            // Group 2 Fix: Calculate Pallet Value purely off Tier, decoupled from active income
            getPalletValue() {
                return this.constants.basePalletValue * Math.pow(1.5, this.state.highestTierUnlocked);
            },

            // Group 2 Fix: Dispatch Capacity Limit
            getDispatchCapacity() {
                return this.constants.baseHubCapacity + (this.state.hubLevel * this.constants.capacityPerHubLevel);
            },

            dispatchPallets() {
                const capacity = this.getDispatchCapacity();
                const palletsToSell = Math.min(Math.floor(this.state.pallets), capacity);
                
                if (palletsToSell > 0) {
                    const earnings = palletsToSell * this.getPalletValue();
                    this.state.money += earnings;
                    this.state.pallets -= palletsToSell;
                    this.updateUI();
                }
            },

            // Group 1 Fix: Unified Rush Job Hook
            triggerRushJob(isPurchased = false) {
                if (isPurchased) {
                    if (this.state.pallets >= 10) {
                        this.state.pallets -= 10;
                    } else {
                        return; // Not enough pallets
                    }
                }
                
                // Triggers the exact same event progression whether bought or natural
                this.state.contractsCompleted++;
                this.state.money += this.calculateIncome() * 60; // 1 minute of income as a bonus
                this.updateUI();
            },

            completeContract() {
                this.state.contractsCompleted++;
                this.state.money += 100 * this.state.hubLevel;
                this.updateUI();
            },

            formatMoney(num) {
                if (num >= 1e6) return (num / 1e6).toFixed(2) + "M";
                if (num >= 1e3) return (num / 1e3).toFixed(2) + "K";
                return num.toFixed(2);
            },

            renderWorkers() {
                const container = document.getElementById('worker-list');
                // Keep the header
                container.innerHTML = '<h2>Workforce</h2>';
                
                this.workers.forEach(w => {
                    const cost = this.getWorkerCost(w.id);
                    const html = `
                    <div class="row">
                        <div class="col-left">
                            <span class="item-name">${w.name} (Owned: ${w.owned})</span>
                            <span class="item-desc">Cost: $${this.formatMoney(cost)}</span>
                        </div>
                        <button onclick="game.buyWorker(${w.id})" ${this.state.money < cost ? 'disabled' : ''}>Hire</button>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', html);
                });
            },

            updateUI() {
                document.getElementById('display-money').innerText = this.formatMoney(this.state.money);
                document.getElementById('display-income').innerText = this.formatMoney(this.calculateIncome());
                document.getElementById('display-pallets').innerText = Math.floor(this.state.pallets);
                
                document.getElementById('hub-level').innerText = this.state.hubLevel;
                document.getElementById('hub-cost').innerText = this.formatMoney(this.getHubCost());
                
                const capacity = this.getDispatchCapacity();
                document.getElementById('display-capacity').innerText = capacity;
                document.getElementById('pallet-value').innerText = this.formatMoney(this.getPalletValue());

                document.getElementById('contract-progress').innerText = this.state.contractsCompleted;

                document.getElementById('btn-upgrade-hub').disabled = this.state.money < this.getHubCost();
                document.getElementById('btn-dispatch').disabled = Math.floor(this.state.pallets) === 0;
                document.getElementById('btn-rush').disabled = this.state.pallets < 10;

                // Update worker buttons dynamically without re-rendering the whole list
                this.workers.forEach(w => {
                    const cost = this.getWorkerCost(w.id);
                    // Just triggering a full render for simplicity in this build
                });
                // To avoid focus loss on mobile, we only render workers when bought.
                // Button states handled directly:
                const btns = document.querySelectorAll('#worker-list button');
                btns.forEach((btn, index) => {
                    const cost = this.getWorkerCost(this.workers[index].id);
                    btn.disabled = this.state.money < cost;
                    btn.previousElementSibling.querySelector('.item-desc').innerText = `Cost: $${this.formatMoney(cost)}`;
                });
            }
        };

        window.onload = () => game.init();

    </script>
</body>
</html>
