name: Build Release AAB (for Play Store)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (whole number, must increase each release: 5, 6, 7...)"
        required: true
        default: "5"
      version_name:
        description: "Version name shown to users (e.g. 1.1)"
        required: true
        default: "1.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Warehouse Empire" com.abdulgames.warehouseempire --web-dir=www
          mkdir -p www
          cp warehouse-empire-android.html www/index.html
          npx cap add android

      - name: Add AdMob plugin
        run: |
          npm install @capacitor-community/admob
          npx cap sync android

      # Without this meta-data the app crashes the instant it launches.
      - name: Inject AdMob app ID into the manifest
        run: |
          sed -i 's|</application>|  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5195464450607116~9510776045"/>\n    </application>|' android/app/src/main/AndroidManifest.xml
          echo "--- manifest check ---"
          grep -B1 -A1 APPLICATION_ID android/app/src/main/AndroidManifest.xml

      - name: Target Android 16 (required by Play from 31 Aug 2026)
        run: |
          if grep -q "targetSdkVersion" android/variables.gradle; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          else
            echo "WARNING: targetSdkVersion not found — check the Capacitor version"
          fi
          cat android/variables.gradle

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Set version numbers
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Verify target SDK before building
        run: |
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle || echo 0)
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::Play requires API 36 from 31 Aug 2026. Found $TARGET."
            exit 1
          fi

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign the bundle
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab warehouse
          rm release.keystore

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-empire-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
