name: Build Release AAB (for Play Store)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (whole number, must increase each release: 10, 11, 12...)"
        required: true
        default: "10"
      version_name:
        description: "Version name shown to users (e.g. 2.0)"
        required: true
        default: "2.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Warehouse Empire" com.abdulgames.warehouseempire --web-dir=www
          mkdir -p www
          cp warehouse-empire-android.html www/index.html
          npx cap add android

      # Preferences and Haptics were referenced by the game but never installed, so
      # saves were living in WebView localStorage -- which Android wipes on "clear
      # cache". Preferences survives that. The migration shim in the game moves an
      # existing localStorage save across on first launch.
      #
      # Deliberately no @capacitor/browser: it drags in androidx.browser 1.9, which
      # demands Android Gradle plugin 8.9.1 while Capacitor's template pins 8.7.2, and
      # the build fails on the AAR metadata check. The store link goes through App
      # instead, which hands the market:// URL to the Play app rather than rendering
      # the Play web page inside a custom tab -- the better result anyway.
      - name: Add Capacitor plugins
        run: |
          npm install @capacitor-community/admob \
                      @capacitor/preferences \
                      @capacitor/haptics \
                      @capacitor/app \
                      @capacitor/local-notifications
          npx cap sync android
          echo "--- registered plugins ---"
          npx cap ls android || true
          echo "--- Android Gradle plugin ---"
          grep -r "com.android.tools.build:gradle" android/build.gradle || true
          # Fails ~2 minutes into Gradle otherwise, on an AAR metadata check whose message
          # does not name the plugin that pulled the dependency in.
          if grep -q '"@capacitor/browser"' package.json; then
            echo "::error::@capacitor/browser needs Android Gradle plugin 8.9.1; the Capacitor template pins 8.7.2. Use App.openUrl for external links."
            exit 1
          fi

      # Ad misconfiguration is invisible until the revenue reports come back empty,
      # so check it here rather than after the slow Gradle build.
      - name: Verify ad configuration
        run: |
          if grep -q "var AD_TESTING = true;" www/index.html; then
            echo "::error::AD_TESTING is true. This release would serve Google test ads and earn nothing."
            exit 1
          fi
          UNITS=$(awk '/var AD_UNITS = \{/,/\};/' www/index.html)
          EMPTY=$(printf '%s\n' "$UNITS" | grep -cE ':[[:space:]]*""' || true)
          IDS=$(printf '%s\n' "$UNITS" | grep -oE 'ca-app-pub-[0-9]{16}/[0-9]{10}' || true)
          COUNT=$(printf '%s\n' "$IDS" | grep -c . || true)
          UNIQ=$(printf '%s\n' "$IDS" | sort -u | grep -c . || true)
          echo "--- ad units ---"
          printf '%s\n' "$IDS"
          echo "found $COUNT unit(s), $UNIQ distinct, $EMPTY empty"
          if [ "$EMPTY" -ne 0 ]; then
            echo "::error::$EMPTY ad unit(s) left empty — those placements would earn nothing."
            exit 1
          fi
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::Expected 6 rewarded ad units, found $COUNT."
            exit 1
          fi
          if [ "$UNIQ" -ne "$COUNT" ]; then
            echo "::error::Duplicate ad unit id — two placements would report against the same unit."
            exit 1
          fi
          # A placeholder id parses as a valid unit and fails silently at runtime, which is
          # worse than an empty string: the placement looks wired and earns nothing.
          if printf '%s\n' "$IDS" | grep -qE 'ca-app-pub-0+/'; then
            echo "::error::A placeholder ad unit id is still in AD_UNITS. Replace it with the real unit from AdMob."
            exit 1
          fi

      # The android/ folder is rebuilt from scratch every run, so Capacitor's
      # placeholder icons come back each time. This regenerates every density
      # plus the Android 8+ adaptive layers from assets/icon.png.
      - name: Generate app icons and splash
        run: |
          if [ ! -f assets/icon.png ]; then
            echo "::error::assets/icon.png is missing. Add a 512x512 (or larger) PNG at that path."
            exit 1
          fi
          # Optional but recommended: separate adaptive layers. Android crops the
          # adaptive icon to a circle/squircle and only the centre 61% is safe, so
          # a full-bleed icon loses its edges. If icon-foreground.png exists,
          # @capacitor/assets uses it for the adaptive layer instead.
          if [ -f assets/icon-foreground.png ]; then
            echo "adaptive foreground supplied — edges protected"
          else
            echo "::warning::No assets/icon-foreground.png. Adaptive launchers will crop the outer ~19% of each edge."
          fi
          BEFORE=$(sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | cut -d' ' -f1)
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#232529' \
            --iconBackgroundColorDark '#232529' \
            --splashBackgroundColor '#232529' \
            --splashBackgroundColorDark '#232529'
          AFTER=$(sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | cut -d' ' -f1)
          echo "icon hash before: $BEFORE"
          echo "icon hash after:  $AFTER"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::Launcher icon is unchanged — the default would ship. Check assets/icon.png."
            exit 1
          fi
          echo "--- generated icon files ---"
          ls android/app/src/main/res/mipmap-anydpi-v26/ || true
          ls android/app/src/main/res/mipmap-xxxhdpi/

      # Two separate things, both required:
      #   AD_ID permission        - without it Android 13+ zeroes the advertising ID,
      #                             so every user looks brand new and ad revenue craters
      #   POST_NOTIFICATIONS      - Android 13+ drops every reminder without it, and the
      #                             runtime prompt never appears
      #   APPLICATION_ID          - without it the app crashes the instant it launches
      - name: Inject permissions and AdMob app ID into the manifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s|<application|<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n\n    <application|' $MF
          sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n\n    <application|' $MF
          sed -i 's|</application>|  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5195464450607116~9510776045"/>\n    </application>|' $MF
          echo "--- manifest check ---"
          grep -E "AD_ID|APPLICATION_ID|POST_NOTIFICATIONS" $MF
          if ! grep -q "permission.AD_ID" $MF; then
            echo "::error::AD_ID permission missing. Play will reject the release."
            exit 1
          fi
          if ! grep -q "permission.POST_NOTIFICATIONS" $MF; then
            echo "::error::POST_NOTIFICATIONS missing. Reminders would be silently dropped on Android 13+."
            exit 1
          fi
          if ! grep -q "ads.APPLICATION_ID" $MF; then
            echo "::error::AdMob APPLICATION_ID missing. The app would crash on launch."
            exit 1
          fi

      - name: Target Android 16 (required by Play from 31 Aug 2026)
        run: |
          if grep -q "targetSdkVersion" android/variables.gradle; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          else
            echo "WARNING: targetSdkVersion not found — check the Capacitor version"
          fi
          cat android/variables.gradle

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Set version numbers
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.event.inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # If Capacitor's template ever stops saying "versionCode 1", the sed above
      # silently does nothing and an AAB with versionCode 1 gets built and
      # rejected on upload. Fail here instead, before the slow Gradle step.
      - name: Verify version code was applied
        run: |
          WANT="${{ github.event.inputs.version_code }}"
          GOT=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle | head -1)
          echo "wanted versionCode $WANT, found $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::versionCode is $GOT, expected $WANT. The substitution did not apply."
            exit 1
          fi

      - name: Verify target SDK before building
        run: |
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle || echo 0)
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::Play requires API 36 from 31 Aug 2026. Found $TARGET."
            exit 1
          fi

      - name: Build release bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign the bundle
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          jarsigner -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab warehouse
          rm release.keystore

      - name: Upload signed AAB
        uses: actions/upload-artifact@v5
        with:
          name: warehouse-empire-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
