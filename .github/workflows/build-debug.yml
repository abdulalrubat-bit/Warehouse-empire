name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "warehouse-empire-android.html"
      - ".github/workflows/build-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Warehouse Empire" com.abdulgames.warehouseempire --web-dir=www
          mkdir -p www
          cp warehouse-empire-android.html www/index.html
          npx cap add android

      # Debug builds must never serve live ads -- tapping your own production ads is
      # an AdMob policy violation and can get the account struck. This flips the flag
      # in the bundled copy only, so it cannot be forgotten and the committed source
      # stays release-ready.
      - name: Force Google test ads in debug builds
        run: |
          sed -i 's/var AD_TESTING = false;/var AD_TESTING = true;/' www/index.html
          if ! grep -q "var AD_TESTING = true;" www/index.html; then
            echo "::error::Could not enable AD_TESTING — check the flag name in the game source."
            exit 1
          fi
          grep -n "var AD_TESTING" www/index.html

      # Preferences and Haptics were referenced by the game but never installed, so
      # saves were living in WebView localStorage -- which Android wipes on "clear
      # cache". Preferences survives that. The migration shim in the game moves an
      # existing localStorage save across on first launch.
      #
      # Deliberately no @capacitor/browser: it drags in androidx.browser 1.9, which
      # demands Android Gradle plugin 8.9.1 while Capacitor's template pins 8.7.2, and
      # the build fails on the AAR metadata check. The store link goes through App
      # instead, which hands the market:// URL to the Play app rather than rendering
      # the Play web page inside a custom tab -- the better result anyway.
      - name: Add Capacitor plugins
        run: |
          npm install @capacitor-community/admob \
                      @capacitor/preferences \
                      @capacitor/haptics \
                      @capacitor/app \
                      @capacitor/local-notifications
          npx cap sync android
          echo "--- registered plugins ---"
          npx cap ls android || true
          echo "--- Android Gradle plugin ---"
          grep -r "com.android.tools.build:gradle" android/build.gradle || true
          # Fails ~2 minutes into Gradle otherwise, on an AAR metadata check whose message
          # does not name the plugin that pulled the dependency in.
          if grep -q '"@capacitor/browser"' package.json; then
            echo "::error::@capacitor/browser needs Android Gradle plugin 8.9.1; the Capacitor template pins 8.7.2. Use App.openUrl for external links."
            exit 1
          fi

      # Same injections as the release build, so debug behaviour matches what ships:
      #   AD_ID permission   - Android 13+ zeroes the advertising ID without it
      #   POST_NOTIFICATIONS - Android 13+ drops every reminder without it
      #   APPLICATION_ID     - the app crashes the instant it launches without it
      - name: Inject permissions and AdMob app ID into the manifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s|<application|<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n\n    <application|' $MF
          sed -i '0,/<application/s|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n\n    <application|' $MF
          sed -i 's|</application>|  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5195464450607116~9510776045"/>\n    </application>|' $MF
          echo "--- manifest check ---"
          grep -E "AD_ID|APPLICATION_ID|POST_NOTIFICATIONS" $MF

      # Debug targets the same SDK as release, so what you test is what ships.
      - name: Target Android 16
        run: |
          if grep -q "targetSdkVersion" android/variables.gradle; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          else
            echo "WARNING: targetSdkVersion not found — check the Capacitor version"
          fi
          cat android/variables.gradle

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Verify target SDK before building
        run: |
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle || echo 0)
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::Play requires API 36 from 31 Aug 2026. Found $TARGET."
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-empire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
