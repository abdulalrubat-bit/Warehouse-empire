name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "warehouse-empire-android.html"
      - ".github/workflows/build-debug.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Warehouse Empire" com.abdulgames.warehouseempire --web-dir=www
          mkdir -p www
          cp warehouse-empire-android.html www/index.html
          npx cap add android

      # Debug builds must never serve live ads -- tapping your own production ads is
      # an AdMob policy violation and can get the account struck. This flips the flag
      # in the bundled copy only, so it cannot be forgotten and the committed source
      # stays release-ready.
      - name: Force Google test ads in debug builds
        run: |
          sed -i 's/var AD_TESTING = false;/var AD_TESTING = true;/' www/index.html
          if ! grep -q "var AD_TESTING = true;" www/index.html; then
            echo "::error::Could not enable AD_TESTING — check the flag name in the game source."
            exit 1
          fi
          grep -n "var AD_TESTING" www/index.html

      - name: Add AdMob plugin
        run: |
          npm install @capacitor-community/admob
          npx cap sync android

      # Same two injections as the release build, so debug ad behaviour matches what
      # ships:
      #   AD_ID permission  - Android 13+ zeroes the advertising ID without it
      #   APPLICATION_ID    - the app crashes the instant it launches without it
      - name: Inject AdMob permission and app ID into the manifest
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s|<application|<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n\n    <application|' $MF
          sed -i 's|</application>|  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5195464450607116~9510776045"/>\n    </application>|' $MF
          echo "--- manifest check ---"
          grep -E "AD_ID|APPLICATION_ID" $MF

      # Debug targets the same SDK as release, so what you test is what ships.
      - name: Target Android 16
        run: |
          if grep -q "targetSdkVersion" android/variables.gradle; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          else
            echo "WARNING: targetSdkVersion not found — check the Capacitor version"
          fi
          cat android/variables.gradle

      - name: Fix Kotlin duplicate classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Verify target SDK before building
        run: |
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K\d+' android/variables.gradle || echo 0)
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "::error::Play requires API 36 from 31 Aug 2026. Found $TARGET."
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-empire-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
