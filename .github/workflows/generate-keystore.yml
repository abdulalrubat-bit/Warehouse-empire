name: Generate Keystore (run once only)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore with random password
        run: |
          PASSWORD=$(openssl rand -base64 18)
          keytool -genkeypair -v \
            -keystore warehouse-empire.keystore \
            -alias warehouse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Warehouse Empire, OU=Games, O=AbdulGames, L=Melbourne, ST=VIC, C=AU"
          base64 -w0 warehouse-empire.keystore > keystore-base64.txt
          {
            echo "KEEP THIS FILE SAFE - BACK IT UP TO CLOUD STORAGE"
            echo ""
            echo "Keystore password (save as secret KEYSTORE_PASSWORD):"
            echo "$PASSWORD"
            echo ""
            echo "Keystore as base64 (save as secret KEYSTORE_BASE64) is in keystore-base64.txt"
          } > README-KEYSTORE.txt

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v5
        with:
          name: KEYSTORE-BACKUP-KEEP-SAFE
          path: |
            warehouse-empire.keystore
            keystore-base64.txt
            README-KEYSTORE.txt
          retention-days: 90
