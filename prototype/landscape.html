<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Warehouse Empire — landscape prototype</title>
<style>
  :root{
    --bg:#11151a; --panel:rgba(20,25,31,.88); --line:#2c343d; --ink:#e9edf1;
    --dim:#8d959e; --hivis:#f2620f; --cash:#3fb264; --corp:#a855f7; --hazard:#f5b90b;
    --font-cond:"Arial Narrow",Roboto,system-ui,sans-serif;
    --font-mono:"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--font-mono);-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #scene{position:fixed;inset:0;display:block;touch-action:none;}

  /* Panels float over the canvas so the site fills the whole screen, which is the
     point of going landscape. Everything is anchored to a corner rather than in flow. */
  .hud{position:fixed;z-index:3;pointer-events:none;}
  .hud > *{pointer-events:auto;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:10px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

  #topbar{top:0;left:0;right:0;display:flex;gap:10px;align-items:stretch;padding:8px 10px;}
  #brand{display:flex;align-items:center;gap:8px;font-family:var(--font-cond);
    font-weight:800;font-size:15px;letter-spacing:2px;text-transform:uppercase;padding:8px 12px;}
  #brand span{color:var(--hivis)}
  #money{flex:1;display:flex;align-items:center;gap:16px;}
  #money b{font-family:var(--font-cond);font-size:22px;letter-spacing:1px;}
  #money .sub{font-size:10px;color:var(--dim);}
  #money .sub i{color:var(--cash);font-style:normal;}

  #left{top:62px;left:10px;width:190px;display:flex;flex-direction:column;gap:8px;}
  .label{font-family:var(--font-cond);font-size:10px;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
  .row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10.5px;padding:3px 0;}
  .row b{font-family:var(--font-cond);font-size:12px;letter-spacing:.5px;}

  #right{top:62px;right:10px;display:flex;flex-direction:column;gap:6px;}
  .ctl{width:46px;height:46px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;color:var(--ink);font-size:17px;cursor:pointer;}
  .ctl small{font-size:6.5px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;}
  .ctl:active{background:#232a32}

  #tabs{bottom:0;left:0;right:0;display:flex;background:linear-gradient(180deg,#191e24,#12161b);
    border-top:1px solid var(--line);}
  #tabs button{flex:1;background:none;border:0;color:var(--dim);padding:9px 4px 10px;
    font-family:var(--font-cond);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  #tabs button.on{color:var(--hivis);box-shadow:inset 0 2px 0 var(--hivis);background:#1c2229;}
  #tabs svg{width:17px;height:17px;fill:currentColor}

  #pick{position:fixed;z-index:4;bottom:56px;left:50%;transform:translateX(-50%);
    padding:11px 40px;border:0;border-radius:7px;cursor:pointer;
    background:linear-gradient(180deg,#ff7a24,#d24f06);color:#20130a;
    font-family:var(--font-cond);font-weight:800;font-size:17px;letter-spacing:3px;
    text-transform:uppercase;box-shadow:0 3px 0 #a03c02,0 5px 14px rgba(0,0,0,.45);}
  #pick:active{transform:translateX(-50%) translateY(2px);box-shadow:0 1px 0 #a03c02;}

  #stats{bottom:56px;right:10px;display:flex;gap:6px;}
  #stats .card{padding:6px 10px;text-align:center;}
  #stats .card b{display:block;font-family:var(--font-cond);font-size:13px;}
  #stats .card span{font-size:7.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);z-index:9;font-family:var(--font-cond);letter-spacing:3px;
    text-transform:uppercase;color:var(--dim);font-size:13px;}

  /* Portrait is not supported in this prototype -- say so rather than showing a
     broken layout, since the whole point is the wide composition. */
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:var(--bg);z-index:10;text-align:center;padding:30px;}
  #rotate b{font-family:var(--font-cond);font-size:16px;letter-spacing:2px;text-transform:uppercase;}
  #rotate p{font-size:11px;color:var(--dim);line-height:1.7;margin:0;max-width:280px;}
  @media (orientation:portrait){ #rotate{display:flex} }
</style>
</head>

<script>
(function(){
  "use strict";

  // ---- projection -------------------------------------------------------------------
  // Identical to the shipping game: x = (px-py)*TW, y = (px+py)*TW/2 - pz*TW. The sprite
  // atlas was rendered to match this exactly, so a sprite's recorded origin lands on the
  // same point pt() returns for its grid cell.
  var TW_BASE = 18, TW = TW_BASE, TH = TW / 2;
  var zoom = 1.6, cx = 0, cy = 0;
  var ATLAS_TILE = 144;                       // px per tile the atlas was rendered at

  function pt(px, py, pz){
    return { x: cx + (px - py) * TW, y: cy + (px + py) * TH - pz * TW };
  }

  var cv = document.getElementById("scene");
  var ctx = cv.getContext("2d", { alpha: false });
  var CW = 0, CH = 0, DPR = 1;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    CW = window.innerWidth; CH = window.innerHeight;
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    cv.style.width = CW + "px"; cv.style.height = CH + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- atlas ------------------------------------------------------------------------
  var atlas = new Image(), frames = null, atlasReady = false;

  // Loaded as a script rather than fetched: fetch() is CORS-blocked on file://, and a
  // script tag works identically under the Capacitor WebView.
  function loadAtlas(){
    return Promise.resolve(window.__ATLAS).then(function(j){
      if (!j) throw new Error("atlas.js did not load");
      frames = j.frames; ATLAS_TILE = j.tilePx || 144;
      return new Promise(function(res, rej){
        atlas.onload = res; atlas.onerror = function(){ rej(new Error("atlas image failed")); };
        // Inlined as a data URI so the file works standalone -- opened from a phone's
        // Downloads folder there is no sibling atlas.png to fetch.
        atlas.src = window.__ATLAS_PNG || "atlas.png";
      });
    }).then(function(){
      atlasReady = true;
      document.getElementById("sAtlas").textContent =
        atlas.width + "×" + atlas.height + " · " + Object.keys(frames).length;
    });
  }

  // One tile spans sqrt(2) camera units in the render, which came out ATLAS_TILE px wide.
  // Scaling by the ratio of the live tile width to that puts sprites at the right size.
  function spriteScale(){ return (TW * 2) / ATLAS_TILE; }

  var drawn = 0;
  function drawSprite(name, px, py, pz){
    var f = frames[name];
    if (!f) return;
    var s = spriteScale();
    var o = pt(px, py, pz);
    var w = f.w * s, h = f.h * s;
    var x = o.x - f.ax * s, y = o.y - f.ay * s;
    if (x > CW || y > CH || x + w < 0 || y + h < 0) return;   // cheap cull
    ctx.drawImage(atlas, f.x, f.y, f.w, f.h, x, y, w, h);
    drawn++;
  }

  // ---- ground -----------------------------------------------------------------------
  // Drawn as flat diamonds rather than sprites: it tiles infinitely, costs almost
  // nothing, and keeps the atlas for things that actually have shape.
  function diamond(px, py, w, d, fill){
    var a = pt(px, py, 0), b = pt(px + w, py, 0), c = pt(px + w, py + d, 0), e = pt(px, py + d, 0);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(e.x, e.y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  // ---- the site ---------------------------------------------------------------------
  // Grid is in tiles. The composition is fixed; what grows with "progression" is the
  // racking, the fleet and how full the yard is.
  var SITE = { w: 50, d: 25 };
  var level = 3;                                // 0..8, drives how built-out the site is

  function siteEntities(){
    var out = [];
    // `f` is the object's footprint in tiles. A big sprite drawn from its centre still
    // has to sort by its FRONT corner, or anything standing in front of it sorts lower
    // and gets painted over -- which is what put trucks behind the shed roof.
    function add(name, x, y, z, f, layer){
      out.push({ n: name, x: x, y: y, z: z || 0, f: f || 0, l: layer || 2 });
    }

    var FP = 0.4;
    for (var i = 0; i < SITE.w; i += FP){
      if (i < 22 || i > 27) add("fence-0", i, -0.5, 0, 0, 1);
      add("fence-0", i, SITE.d + 0.5, 0, 0, 3);
    }
    for (var j = -0.5; j < SITE.d + 0.5; j += FP){
      add("fence-90", -0.5, j, 0, 0, 1);
      add("fence-90", SITE.w + 0.5, j, 0, 0, 3);
    }

    // Shells across the north half, so the whole south yard stays open and everything
    // working in it sorts in front.
    add("office-0", 5, 4, 0, 3.5);
    add("shed-big-0", 19, 5, 0, 6.5);
    if (level >= 2) add("shed-long-90", 33, 5, 0, 5);
    if (level >= 6) add("plant-90", 43, 6, 0, 4.5);
    if (level >= 5) add("dc-flat-0", 40, 20, 0, 6.5);

    // Receiving along the shed's south face -- in the open yard, so they read clearly.
    var docks = Math.min(5, 2 + Math.floor(level / 2));
    for (var t = 0; t < docks; t++){
      add("trailer-180", 13 + t * 3.2, 11.5, 0, 1.2);
      add("truck-180",   13 + t * 3.2, 13.6, 0, 1.2);
    }

    // Outbound rank facing the gate.
    for (var q = 0; q < Math.min(4, 1 + Math.floor(level / 2)); q++)
      add("trailer-90", 30 + q * 2.4, 14, 0, 1.2);

    // Pallet blocks: rows and bays rather than a scatter, like a real yard.
    var bays = 3 + Math.floor(level / 2);
    for (var b = 0; b < bays; b++)
      for (var r = 0; r < 4; r++){
        var gx = 4 + b * 2.2, gy = 19 + r * 1.1;
        var hgt = 1 + ((b + r) % 3);
        for (var k = 0; k < hgt; k++)
          add(k === 0 ? "box-large" : (k === 1 ? "box-wide" : "box-small"), gx, gy, k * 0.18, 0.4);
      }

    for (var fl = 0; fl < Math.min(6, 1 + level); fl++)
      add("forklift-" + [90,270,0,180][fl % 4], 17 + fl * 2.4, 19 + (fl % 3) * 1.8, 0, 0.8);

    for (var c2 = 0; c2 < 9; c2++)
      add(["car-a-90","car-b-90","car-c-90"][c2 % 3], 1.8, 9 + c2 * 1.5, 0, 0.9);

    if (level >= 3){ add("tank", 47, 12, 0, 2); add("tank", 47, 15, 0, 2); }
    if (level >= 4) add("chimney", 46, 3, 0, 2);
    if (level >= 5) add("hopper", 44, 17, 0, 1.4);
    if (level >= 7) add("crane-0", 26, 22, 0, 1.6);

    for (var l2 = 0; l2 < 8; l2++) add("lamp-0", 2 + l2 * 6, 16.6, 0, 0);
    add("dumpster-0", 2.5, 22, 0, 0.6); add("dumpster-0", 3.4, 22, 0, 0.6);
    for (var cn = 0; cn < 6; cn++) add("cone", 22 + cn * 0.5, 16.9, 0, 0);
    add("pole-0", 48.5, 4, 0, 0); add("pole-0", 48.5, 14, 0, 0); add("pole-0", 48.5, 22, 0, 0);

    return out;
  }

  // ---- moving plant -----------------------------------------------------------------
  // Agents are entities with a route. Facing comes from the direction of travel: the
  // atlas holds four yaws per vehicle, so picking the nearest one to the heading is all
  // the "animation" a vehicle needs at this scale.
  //
  // Screen-space in this projection: +x runs down-right, +y runs down-left. YAW_FOR maps
  // a heading to the yaw whose sprite faces that way.
  var YAW_FOR = [0, 90, 180, 270];
  function yawFor(dx, dy){
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? YAW_FOR[3] : YAW_FOR[1];
    return dy > 0 ? YAW_FOR[0] : YAW_FOR[2];
  }

  function route(pts, speed, phase){
    return { pts: pts, speed: speed, t: phase || 0, len: pts.length };
  }

  // Position along a closed polyline, plus the heading there.
  function along(r, time){
    var total = 0, segs = [];
    for (var i = 0; i < r.pts.length; i++){
      var a = r.pts[i], b = r.pts[(i + 1) % r.pts.length];
      var d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      segs.push(d); total += d;
    }
    var u = ((time * r.speed + r.t) % total + total) % total;
    for (var j = 0; j < segs.length; j++){
      if (u <= segs[j]){
        var p = r.pts[j], q = r.pts[(j + 1) % r.pts.length];
        var k = segs[j] < 1e-6 ? 0 : u / segs[j];
        return { x: p[0] + (q[0] - p[0]) * k, y: p[1] + (q[1] - p[1]) * k,
                 dx: q[0] - p[0], dy: q[1] - p[1], seg: j, k: k };
      }
      u -= segs[j];
    }
    return { x: r.pts[0][0], y: r.pts[0][1], dx: 1, dy: 0, seg: 0, k: 0 };
  }

  var agents = [];
  function buildAgents(){
    agents = [];
    // Forklifts shuttle between the pallet blocks and the dock apron, carrying a box on
    // the outbound leg only -- the empty return is what makes it read as work.
    var lanes = Math.min(5, 1 + level);
    for (var i = 0; i < lanes; i++){
      var y0 = 19.5 + i * 1.2;
      agents.push({ kind: "forklift", carry: true,
        r: route([[5, y0], [17, y0], [17, y0 + 0.5], [5, y0 + 0.5]], 1.6 + i * 0.12, i * 3.1) });
    }
    // Trucks run the perimeter road: in at the gate, along the front, out again.
    var trucks = Math.min(4, 1 + Math.floor(level / 2));
    for (var t = 0; t < trucks; t++){
      agents.push({ kind: t % 2 ? "van" : "truck",
        r: route([[24, -1.5], [24, 8], [40, 8], [44, 12], [44, 21], [8, 21], [8, 8], [24, 8], [24, -1.5]],
                 2.4 + t * 0.3, t * 9) });
    }
    // A yard shunter working the outbound rank.
    if (level >= 3)
      agents.push({ kind: "delivery",
        r: route([[30, 14.5], [38, 14.5], [38, 16], [30, 16]], 1.1, 2) });
  }

  function agentEntities(time){
    var out = [];
    for (var i = 0; i < agents.length; i++){
      var a = agents[i], p = along(a.r, time);
      var yaw = yawFor(p.dx, p.dy);
      out.push({ n: a.kind + "-" + yaw, x: p.x, y: p.y, z: 0, f: 1.0, l: 2 });
      // Loaded on the run away from the racking, empty on the way back.
      if (a.carry && p.seg < 2)
        out.push({ n: "box-large", x: p.x + 0.25, y: p.y + 0.25, z: 0.22, f: 1.0, l: 2 });
    }
    return out;
  }

  // Chimney smoke: drawn rather than sprited, so it can drift and fade without needing
  // frames in the atlas.
  var puffs = [];
  function tickSmoke(time, dt){
    if (level < 4) { puffs.length = 0; return; }
    if (puffs.length < 14 && Math.random() < dt * 3)
      puffs.push({ x: 46, y: 3, z: 2.1, r: 0.28, age: 0 });
    for (var i = puffs.length - 1; i >= 0; i--){
      var p = puffs[i];
      p.age += dt; p.z += dt * 0.55; p.x += dt * 0.22; p.r += dt * 0.28;
      if (p.age > 4.2) puffs.splice(i, 1);
    }
  }
  function drawSmoke(){
    for (var i = 0; i < puffs.length; i++){
      var p = puffs[i], o = pt(p.x, p.y, p.z);
      var a = Math.max(0, 0.34 * (1 - p.age / 4.2));
      ctx.beginPath();
      ctx.arc(o.x, o.y, p.r * TW, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(226,232,238," + a.toFixed(3) + ")";
      ctx.fill();
    }
  }

  var entities = siteEntities();

  // Painter's algorithm, same key the shipping game uses: layer, then depth, then height.
  function sortKey(e){ return e.l * 100000 + (e.x + e.y + (e.f || 0)) * 100 + e.z; }
  function rebuild(){
    entities = siteEntities();
    buildAgents();
    entities.sort(function(a, b){ return sortKey(a) - sortKey(b); });
    document.getElementById("sRack").textContent = 8 + level * 5;
    document.getElementById("sFleet").textContent = Math.min(6, 1 + level);
    document.getElementById("sDock").textContent = Math.min(5, 2 + Math.floor(level / 2));
    document.getElementById("stA").textContent = (8 + level * 5) * 3;
    document.getElementById("stB").textContent = Math.min(5, 2 + Math.floor(level / 2));
    document.getElementById("fleetline").textContent = "Site level " + level + " / 8";
  }
  rebuild();

  // ---- frame ------------------------------------------------------------------------
  var lastMs = 0, msAvg = 0;

  var now = 0, prevT = 0;
  function draw(){
    var t0 = performance.now();
    var dt = prevT ? Math.min(0.1, (t0 - prevT) / 1000) : 0;
    prevT = t0; now += dt;
    tickSmoke(now, dt);
    TW = TW_BASE * zoom; TH = TW / 2;
    drawn = 0;

    // sky then ground
    var g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, "#7fb0dc"); g.addColorStop(0.55, "#a8c8e4"); g.addColorStop(1, "#cbdcea");
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);

    diamond(-8, -8, SITE.w + 18, SITE.d + 18, "#6f8f52");        // grass surround
    diamond(-2, -2, SITE.w + 4, SITE.d + 4, "#5b6169");          // asphalt apron
    diamond(0, 0, SITE.w, SITE.d, "#71777f");                     // yard slab
    diamond(11, 10.5, 20, 5, "#5f666e");                          // receiving lane
    diamond(28, 12.5, 12, 4, "#5f666e");                          // outbound apron
    diamond(1, 16.4, SITE.w - 2, 0.6, "#8a6f1e");                 // hazard walkway
    diamond(22, -1, 5, 3, "#4f555c");                             // gate road

    if (atlasReady){
      // Static scenery is pre-sorted; only the handful of moving things need placing
      // into it each frame, so this is a merge rather than a full re-sort.
      var moving = agentEntities(now);
      moving.sort(function(a, b){ return sortKey(a) - sortKey(b); });
      var si = 0, mi = 0;
      while (si < entities.length || mi < moving.length){
        var takeStatic = mi >= moving.length ||
          (si < entities.length && sortKey(entities[si]) <= sortKey(moving[mi]));
        var e = takeStatic ? entities[si++] : moving[mi++];
        drawSprite(e.n, e.x, e.y, e.z);
      }
      drawSmoke();
    }

    var ms = performance.now() - t0;
    msAvg = msAvg ? msAvg * 0.9 + ms * 0.1 : ms;
    if (t0 - lastMs > 250){
      lastMs = t0;
      document.getElementById("sDraw").textContent = drawn;
      document.getElementById("sMs").textContent = msAvg.toFixed(1) + "ms";
    }
    requestAnimationFrame(draw);
  }

  // ---- input ------------------------------------------------------------------------
  var drag = null;
  cv.addEventListener("pointerdown", function(ev){
    drag = { x: ev.clientX, y: ev.clientY, cx: cx, cy: cy };
    cv.setPointerCapture(ev.pointerId);
  });
  cv.addEventListener("pointermove", function(ev){
    if (!drag) return;
    cx = drag.cx + (ev.clientX - drag.x);
    cy = drag.cy + (ev.clientY - drag.y);
  });
  cv.addEventListener("pointerup", function(){ drag = null; });
  cv.addEventListener("pointercancel", function(){ drag = null; });
  cv.addEventListener("wheel", function(ev){
    ev.preventDefault();
    setZoom(zoom * (ev.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });

  function setZoom(z){ zoom = Math.max(0.5, Math.min(4, z)); }
  // In this projection the site's screen width is (w+d)*TW and its height (w+d)*TH, so
  // the diagonal -- not the tile count -- is what has to fit. Height is the binding
  // constraint on a wide screen once the HUD bands are taken off.
  function centre(){
    var span = SITE.w + SITE.d;
    var usableW = CW - 220, usableH = CH - 150;      // side panels, top bar, tab bar
    var fitW = usableW / span, fitH = usableH / (span / 2);
    zoom = Math.max(0.35, Math.min(4, Math.min(fitW, fitH) / TW_BASE));
    TW = TW_BASE * zoom; TH = TW / 2;
    cx = 0; cy = 0;
    var mid = pt(SITE.w / 2, SITE.d / 2, 0);
    cx = CW / 2 - mid.x; cy = CH / 2 - mid.y;
  }

  document.getElementById("zin").onclick  = function(){ setZoom(zoom * 1.25); };
  document.getElementById("zout").onclick = function(){ setZoom(zoom / 1.25); };
  document.getElementById("cen").onclick  = centre;
  document.getElementById("grow").onclick = function(){
    level = (level + 1) % 9; rebuild();
  };

  var cash = 0, rate = 8650;
  document.getElementById("pick").onclick = function(){ cash += rate * 0.05; };
  setInterval(function(){
    cash += rate / 10;
    document.getElementById("cash").textContent = "$" + fmt(cash);
    document.getElementById("rate").textContent = "$" + fmt(rate);
    document.getElementById("tapv").textContent = "tap $" + fmt(rate * 0.05);
  }, 100);

  function fmt(n){
    if (!isFinite(n)) return "0";
    if (n < 1000) return (Math.floor(n * 10) / 10).toString().replace(/\.0$/, "");
    var u = ["K","M","B","T"], i = -1;
    while (n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
    return (Math.floor(n * 100) / 100) + u[i];
  }

  document.querySelectorAll("#tabs button").forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll("#tabs button").forEach(function(o){ o.classList.remove("on"); });
      b.classList.add("on");
    };
  });

  loadAtlas().then(function(){
    centre();
    document.getElementById("loading").remove();
    requestAnimationFrame(draw);
  }).catch(function(err){
    document.getElementById("loading").textContent = "Atlas failed: " + err.message;
  });
})();
</script>
</body>
</html>
